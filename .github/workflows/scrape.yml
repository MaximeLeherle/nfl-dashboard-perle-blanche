name: Relevé Sportips

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub lance souvent avec 5 à 20 min de retard
  workflow_dispatch:
    inputs:
      refresh_roster:
        description: "Reconstruire la liste des coureurs de l'équipe"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Relevé
        run: node scraper/scrape.mjs
        env:
          REFRESH_ROSTER: ${{ inputs.refresh_roster && '1' || '' }}

      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Relevé $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
